name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $source = Get-Content ./main.go -Raw
          $versionMatch = [regex]::Match($source, 'var appVersion = "([^"]+)"')
          if (-not $versionMatch.Success) {
            throw "Nao foi possivel localizar appVersion em main.go."
          }
          $sourceVersion = $versionMatch.Groups[1].Value
          if ($sourceVersion -ne $version) {
            throw "Tag v$version diverge de appVersion=$sourceVersion. Atualize a versao ou crie a tag correta."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $required = @{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            ARTIFACT_SIGNING_ENDPOINT = $env:ARTIFACT_SIGNING_ENDPOINT
            ARTIFACT_SIGNING_ACCOUNT_NAME = $env:ARTIFACT_SIGNING_ACCOUNT_NAME
            ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Release bloqueada: configure Artifact Signing antes de publicar. Faltando: $($missing -join ', '). Consulte docs/DISTRIBUICAO_WINDOWS.md."
          }

      - name: Validate
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            $bad
            throw "Arquivos fora do padrao gofmt."
          }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go vet ./...
          go test ./...

      - name: Generate Windows resources
        shell: pwsh
        run: ./tools/prepare-resources.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Build release x64 and x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $ld = "-H=windowsgui -X main.appVersion=$version"

          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $goArgs = @('build', '-trimpath', '-buildvcs=false', '-ldflags', $ld, '-o', "dist/FirebirdToolbox_$tag.exe", '.')
          & go @goArgs
          if ($LASTEXITCODE -ne 0) { throw "go build x64 falhou com codigo $LASTEXITCODE." }

          $env:GOARCH = '386'
          $goArgs = @('build', '-trimpath', '-buildvcs=false', '-ldflags', $ld, '-o', "dist/FirebirdToolbox_${tag}_x86.exe", '.')
          & go @goArgs
          if ($LASTEXITCODE -ne 0) { throw "go build x86 falhou com codigo $LASTEXITCODE." }

          ./tools/verify-windows-build.ps1 -Path "dist/FirebirdToolbox_$tag.exe" -Version $version
          ./tools/verify-windows-build.ps1 -Path "dist/FirebirdToolbox_${tag}_x86.exe" -Version $version

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\dist\FirebirdToolbox_${{ github.ref_name }}.exe
            ${{ github.workspace }}\dist\FirebirdToolbox_${{ github.ref_name }}_x86.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Firebird Toolbox
          description-url: https://github.com/${{ github.repository }}
          cache-dependencies: false

      - name: Verify Authenticode and timestamp
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.version }}'
          $files = @("dist/FirebirdToolbox_$tag.exe", "dist/FirebirdToolbox_${tag}_x86.exe")
          foreach ($file in $files) {
            ./tools/verify-windows-build.ps1 -Path $file -Version $version -RequireSignature -RequireTimestamp
          }

          $signature = Get-AuthenticodeSignature -FilePath $files[0]
          @(
            'SIGNED - Microsoft Artifact Signing',
            "Status: $($signature.Status)",
            "Subject: $($signature.SignerCertificate.Subject)",
            "Issuer: $($signature.SignerCertificate.Issuer)",
            "Thumbprint: $($signature.SignerCertificate.Thumbprint)",
            "Timestamp subject: $($signature.TimeStamperCertificate.Subject)"
          ) | Set-Content -Encoding UTF8 dist/SIGNATURE_STATUS.txt

      - name: Microsoft Defender preflight
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          ./tools/defender-preflight.ps1 -Path @(
            "dist/FirebirdToolbox_$tag.exe",
            "dist/FirebirdToolbox_${tag}_x86.exe"
          )

      - name: Package and hash release
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $bundle = 'dist/bundle'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "dist/FirebirdToolbox_$tag.exe" $bundle
          Copy-Item "dist/FirebirdToolbox_${tag}_x86.exe" $bundle
          Copy-Item "dist/SIGNATURE_STATUS.txt" $bundle
          Copy-Item README.md, CHANGELOG.md, LEIA-ME.md, LICENSE, SECURITY.md $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/FirebirdToolbox_${tag}_completo.zip" -Force
          Remove-Item $bundle -Recurse -Force

          Get-ChildItem dist -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ASCII "dist/FirebirdToolbox_${tag}_SHA256.txt"

      - name: Attest x64 executable provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/FirebirdToolbox_${{ github.ref_name }}.exe

      - name: Attest x86 executable provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/FirebirdToolbox_${{ github.ref_name }}_x86.exe

      - name: Attest release bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/FirebirdToolbox_${{ github.ref_name }}_completo.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag `
            "dist/FirebirdToolbox_$tag.exe" `
            "dist/FirebirdToolbox_${tag}_x86.exe" `
            "dist/FirebirdToolbox_${tag}_completo.zip" `
            "dist/FirebirdToolbox_${tag}_SHA256.txt" `
            "dist/SIGNATURE_STATUS.txt" `
            --title "Firebird Toolbox $tag" `
            --generate-notes
