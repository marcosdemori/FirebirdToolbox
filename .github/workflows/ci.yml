name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Check gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            $bad
            throw "Arquivos fora do padrao gofmt."
          }

      - name: Vet Windows x64
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go vet ./...

      - name: Test Windows x64
        shell: pwsh
        run: go test ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o FirebirdToolbox_ci_x64.exe .
          Remove-Item FirebirdToolbox_ci_x64.exe -Force

      - name: Compile Windows x86 tests
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '386'
          go test -c -o FirebirdToolbox_tests_x86.exe .
          Remove-Item FirebirdToolbox_tests_x86.exe -Force

      - name: Build Windows x86
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '386'
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o FirebirdToolbox_x86.exe .
          Remove-Item FirebirdToolbox_x86.exe -Force
