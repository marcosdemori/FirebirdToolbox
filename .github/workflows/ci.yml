name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: true

      - name: Check gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            $bad
            throw "Arquivos fora do padrao gofmt."
          }

      - name: Generate Windows resources
        shell: pwsh
        run: ./tools/prepare-resources.ps1 -Version '1.2.32'

      - name: Vet Windows x64
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go vet ./...

      - name: Test Windows x64
        shell: pwsh
        run: go test ./...

      - name: Build and verify Windows x64
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $ld = "-H=windowsgui -X main.appVersion=1.2.32"
          $goArgs = @('build', '-trimpath', '-buildvcs=false', '-ldflags', $ld, '-o', 'FirebirdToolbox_ci_x64.exe', '.')
          & go @goArgs
          if ($LASTEXITCODE -ne 0) { throw "go build x64 falhou com codigo $LASTEXITCODE." }
          ./tools/verify-windows-build.ps1 -Path ./FirebirdToolbox_ci_x64.exe -Version '1.2.32'
          Remove-Item FirebirdToolbox_ci_x64.exe -Force

      - name: Compile Windows x86 tests
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '386'
          go test -c -o FirebirdToolbox_tests_x86.exe .
          Remove-Item FirebirdToolbox_tests_x86.exe -Force

      - name: Build and verify single Windows x86/x64 executable
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = '386'
          $ld = "-H=windowsgui -X main.appVersion=1.2.32"
          $goArgs = @('build', '-trimpath', '-buildvcs=false', '-ldflags', $ld, '-o', 'FirebirdToolbox_ci_x86_x64.exe', '.')
          & go @goArgs
          if ($LASTEXITCODE -ne 0) { throw "go build x86/x64 falhou com codigo $LASTEXITCODE." }
          ./tools/verify-windows-build.ps1 -Path ./FirebirdToolbox_ci_x86_x64.exe -Version '1.2.32'
          Remove-Item FirebirdToolbox_ci_x86_x64.exe -Force
